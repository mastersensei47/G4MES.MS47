<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS47 - Inicio</title>
<meta name="description" content="Descargas, series y películas de mastersensei47.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="mastersensei47">
<meta property="og:title" content="mastersensei47">
<meta property="og:description" content="Descargas, series y películas de mastersensei47.">
<meta property="og:image" content="https://mastersensei47.github.io/G4MES.MS47/ms47.jpg">
<meta name="twitter:card" content="summary_large_image">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{ --accent:#ff2e2e; }
body{
    margin:0;
    font-family:var(--font-body,'Montserrat',sans-serif);
    background:var(--bg,#0f0f0f);
    color:var(--text,white);
}

/* ====== AVISO ====== */
.aviso{
    display:none;
    background:var(--accent);
    color:#fff;
    text-align:center;
    padding:10px 16px;
    font-weight:700;
    font-size:14px;
}

/* ====== BANNER ====== */
.banner{
    background:var(--card2,#1a1a1a) center/cover no-repeat;
    height:300px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}
.banner::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
}
.banner h1{
    position:relative;
    z-index:1;
    margin:0 16px;
    text-align:center;
    font-size:60px;
    font-weight:900;
    color:var(--accent);
    text-shadow:0 0 20px var(--accent);
}

/* ===== REDES ===== */
.redes{
    text-align:center;
    margin:25px 0;
}
.redes a{
    margin:0 15px;
    font-size:22px;
    color:var(--accent);
    transition:0.3s;
}
.redes a:hover{ color:var(--text,white); }

/* ===== ACTUALIZADOS RECIENTEMENTE ===== */
.recientes{ max-width:1200px; margin:auto; padding:30px 20px 0; display:none; }
.recientes h2{ text-align:center; margin:0 0 30px; font-size:32px; }
.rec-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:22px; }
.rec-card{ background:var(--card,#1c1c1c); border-radius:15px; overflow:hidden; display:flex; flex-direction:column; transition:0.3s; color:var(--text,white); text-decoration:none; }
.rec-card:hover{ transform:translateY(-4px); box-shadow:0 0 22px var(--accent); }
.rec-img{ position:relative; }
.rec-img img{ width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--card2,#262626); }
.rec-play{ position:absolute; right:10px; bottom:10px; width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 2px 10px rgba(0,0,0,.5); }
.rec-info{ padding:12px 14px 14px; }
.rec-info h3{ margin:0; font-size:15px; line-height:1.3; }

/* ===== CATEGORIAS ===== */
.categorias{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}
.categorias h2{
    text-align:center;
    margin-bottom:40px;
    font-size:35px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}
.card{
    background:var(--card,#1c1c1c);
    border-radius:15px;
    overflow:hidden;
    transition:0.4s;
    text-align:center;
}
.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    display:block;
    background:var(--card2,#262626);
}
.card h3{ padding:15px; margin:0; }
.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 25px var(--accent);
}
.card a{
    display:block;
    color:var(--text,white);
    text-decoration:none;
}
.estado{
    grid-column:1 / -1;
    text-align:center;
    color:var(--muted,#888);
    padding:40px 10px;
}

/* ===== FOOTER ===== */
footer{
    text-align:center;
    padding:30px;
    background:var(--card,#111);
    margin-top:40px;
    font-size:14px;
    color:var(--muted,#aaa);
}

@media(max-width:600px){
    .banner h1{ font-size:38px; }
}
</style>
<script src="estilo.js"></script>
<script>MS47_ESTILO.aplicarCache("home");</script>
</head>
<body>

<div class="aviso" id="aviso"></div>

<div class="banner" id="banner">
    <h1 id="sitioNombre">mastersensei47</h1>
</div>

<div class="redes" id="redes"></div>

<section class="recientes" id="recientes">
    <h2>🆕 Actualizados recientemente</h2>
    <div class="rec-grid" id="recGrid"></div>
</section>

<section class="categorias">
    <h2>🎮 Categorías</h2>
    <div class="grid" id="grid">
        <div class="estado">Cargando categorías...</div>
    </div>
</section>

<footer id="footer"></footer>

<!-- Acceso oculto al panel admin: no se ve casi nada, pero se puede tocar/clickear -->
<div onclick="location.href='admin.html'"
     style="position:fixed;bottom:10px;right:10px;width:40px;height:40px;cursor:pointer;z-index:2000;opacity:0.05;">
</div>

<script src="config.js"></script>
<script src="defaults.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const { firebaseConfig } = window.MS47;
const D = window.MS47_DEFAULTS;
const E = window.MS47_ESTILO;
const CACHE_KEY = "ms47_home_v1";

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function urlSegura(u){
  u = String(u || "").trim();
  return (u && !/^\s*(javascript|data|vbscript):/i.test(u)) ? u : "";
}
function leerCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){ return null; } }
function guardarCache(v){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(v)); }catch(e){} }

function idYT(u){
  const m = urlSegura(u).match(/youtu\.be\/([\w-]{6,})|youtube\.com\/(?:embed\/|shorts\/|live\/)([\w-]{6,})|[?&]v=([\w-]{6,})/i);
  return m ? (m[1] || m[2] || m[3]) : "";
}
// Títulos reales de los videos de YouTube (una sola consulta; se guarda 1 hora para no gastar cuota)
async function titulosYT(ids){
  ids = [...new Set(ids)].filter(Boolean);
  if(!ids.length || !window.MS47.YT_API_KEY) return {};
  const key = "ms47_yt_tit";
  try{
    const c = JSON.parse(localStorage.getItem(key));
    if(c && Date.now() - c.t < 3600 * 1000 && ids.every(i => i in c.m)) return c.m;
  }catch(e){}
  try{
    const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&maxResults=50&id=${ids.join(",")}&key=${window.MS47.YT_API_KEY}`);
    const data = await res.json();
    const m = {};
    (data.items || []).forEach(v => { m[v.id] = v.snippet && v.snippet.title || ""; });
    ids.forEach(i => { if(!(i in m)) m[i] = ""; });
    try{ localStorage.setItem(key, JSON.stringify({ t: Date.now(), m })); }catch(e){}
    return m;
  }catch(e){ return {}; }
}
function renderRecientes(cfg){
  const sec = document.getElementById("recientes"), grid = document.getElementById("recGrid");
  const lista = (Array.isArray(cfg.recientesVideos) ? cfg.recientesVideos : [])
    .filter(v => v && urlSegura(v.url)).slice(0, 24);
  if(cfg.recientesOn === false || !lista.length){ sec.style.display = "none"; return; }
  grid.innerHTML = lista.map((v, i) => {
    const id = idYT(v.url);
    const img = urlSegura(v.imagen) || (id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : "");
    const titulo = String(v.titulo || "").trim();
    return `
      <a class="rec-card" href="${esc(urlSegura(v.url))}" target="_blank" rel="noopener" data-id="${esc(id)}">
        <div class="rec-img">
          ${img ? `<img src="${esc(img)}" alt="" loading="lazy" decoding="async">` : `<img alt="" style="visibility:hidden">`}
          <span class="rec-play">▶</span>
        </div>
        <div class="rec-info"><h3 data-manual="${titulo ? 1 : 0}">${esc(titulo || "Ver video")}</h3></div>
      </a>`;
  }).join("");
  grid.querySelectorAll("img").forEach(i => i.addEventListener("error", () => { i.style.visibility = "hidden"; }));
  sec.style.display = "block";
  // Los videos sin título escrito toman el título real de YouTube
  const faltan = [...grid.querySelectorAll('.rec-card')].filter(c => c.querySelector('h3').dataset.manual === "0" && c.dataset.id);
  if(faltan.length) titulosYT(faltan.map(c => c.dataset.id)).then(m => {
    faltan.forEach(c => { const t = m[c.dataset.id]; if(t) c.querySelector("h3").textContent = t; });
  });
}

function render({ config, categorias }){
  const cfg = D.mezclarConfig(config);
  renderRecientes(cfg);

  // Si la base está totalmente vacía (todavía no se cargó nada desde el admin) se usan los valores iniciales
  const usarDefaults = !categorias && !(config && config.inicializado);
  const cats = usarDefaults ? D.DEFAULT_CATEGORIAS : (categorias || {});

  // Estética (general + la de esta página, definidas en el admin → pestaña Estética)
  const temaAplicado = E.aplicarDesdeTemas(cfg.temas, "home", null);

  // Color de acento de "Ajustes del sitio" (si la estética define uno, manda la estética)
  if(temaAplicado.acento){
    document.documentElement.style.removeProperty("--accent");
  }else if(/^#[0-9a-f]{3,8}$/i.test(cfg.colorAcento || "")){
    document.documentElement.style.setProperty("--accent", cfg.colorAcento);
  }

  // Aviso
  const aviso = document.getElementById("aviso");
  if(cfg.aviso){ aviso.textContent = cfg.aviso; aviso.style.display = "block"; }
  else { aviso.style.display = "none"; }

  // Banner
  const banner = document.getElementById("banner");
  const img = urlSegura(cfg.bannerImagen);
  banner.style.backgroundImage = img ? `url("${img.replace(/"/g, "%22")}")` : "none";
  document.getElementById("sitioNombre").textContent = cfg.sitioNombre || "";

  // Redes
  const redes = (Array.isArray(cfg.redes) ? cfg.redes : []).filter(r => r && urlSegura(r.url));
  document.getElementById("redes").innerHTML = redes.map(r => {
    const s = D.SOCIALES[r.tipo] || D.SOCIALES.web;
    return `<a href="${esc(urlSegura(r.url))}" target="_blank" rel="noopener" aria-label="${esc(s.nombre)}"><i class="${s.icono}"></i></a>`;
  }).join("");

  // Footer
  document.getElementById("footer").textContent = cfg.footer || "";

  // Categorías
  const lista = Object.keys(cats)
    .map(slug => ({ slug, ...cats[slug] }))
    .filter(c => c.visible !== false)
    .sort((a, b) => (a.orden ?? 9999) - (b.orden ?? 9999) || String(a.nombre).localeCompare(String(b.nombre)));

  const grid = document.getElementById("grid");
  if(!lista.length){
    grid.innerHTML = `<div class="estado">Todavía no hay categorías.</div>`;
    return;
  }
  grid.innerHTML = lista.map(c => {
    const enlace = urlSegura(c.enlace);
    const href = enlace || `categoria.html?slug=${encodeURIComponent(c.slug)}`;
    const imagen = urlSegura(c.imagen);
    return `
      <div class="card">
        <a href="${esc(href)}">
          ${imagen ? window.MS47_ESTILO.img(imagen, 480, c.nombre) : `<img alt="" style="visibility:hidden">`}
          <h3>${esc(c.nombre)}</h3>
        </a>
      </div>`;
  }).join("");

  grid.querySelectorAll("img").forEach(i => i.addEventListener("error", () => { i.style.visibility = "hidden"; }));
}

async function iniciar(){
  const cache = leerCache();
  if(cache) render(cache);

  try{
    const db = getDatabase(initializeApp(firebaseConfig));
    const [c, k] = await Promise.all([get(ref(db, "config")), get(ref(db, "categorias"))]);
    const datos = { config: c.val(), categorias: k.val() };
    render(datos);
    guardarCache(datos);
  }catch(err){
    console.error(err);
    if(!cache) render({ config: null, categorias: null });
  }
}
iniciar();
</script>

<script src="ms47-widgets.js"></script>
</body>
</html>
