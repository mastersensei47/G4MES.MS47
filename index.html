<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS47 - Inicio</title>
<meta name="description" content="Descargas, series y películas de mastersensei47.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="mastersensei47">
<meta property="og:title" content="mastersensei47">
<meta property="og:description" content="Descargas, series y películas de mastersensei47.">
<meta property="og:image" content="https://mastersensei47.github.io/G4MES.MS47/ms47.jpg">
<meta name="twitter:card" content="summary_large_image">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{ --accent:#ff2e2e; }
body{
    margin:0;
    font-family:var(--font-body,'Montserrat',sans-serif);
    background:var(--bg,#0f0f0f);
    color:var(--text,white);
}

/* ====== AVISO ====== */
.aviso{
    display:none;
    background:var(--accent);
    color:#fff;
    text-align:center;
    padding:10px 16px;
    font-weight:700;
    font-size:14px;
}

/* ====== BANNER ====== */
.banner{
    background:var(--card2,#1a1a1a) center/cover no-repeat;
    height:300px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}
.banner::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
}
.banner h1{
    position:relative;
    z-index:1;
    margin:0 16px;
    text-align:center;
    font-size:60px;
    font-weight:900;
    color:var(--accent);
    text-shadow:0 0 20px var(--accent);
}

/* ===== REDES ===== */
.redes{
    text-align:center;
    margin:25px 0;
}
.redes a{
    margin:0 15px;
    font-size:22px;
    color:var(--accent);
    transition:0.3s;
}
.redes a:hover{ color:var(--text,white); }

/* ===== ACTUALIZADOS RECIENTEMENTE ===== */
.recientes{ max-width:1200px; margin:auto; padding:30px 20px 0; display:none; }
.recientes h2{ text-align:center; margin:0 0 30px; font-size:32px; }
.rec-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:22px; }
.rec-card{ background:var(--card,#1c1c1c); border-radius:15px; overflow:hidden; display:flex; flex-direction:column; transition:0.3s; }
.rec-card:hover{ transform:translateY(-4px); box-shadow:0 0 22px var(--accent); }
.rec-main{ display:block; color:var(--text,white); text-decoration:none; }
.rec-main img{ width:100%; height:150px; object-fit:cover; display:block; background:var(--card2,#262626); }
.rec-info{ padding:12px 14px 4px; }
.rec-info h3{ margin:0 0 8px; font-size:15px; line-height:1.3; }
.rec-meta{ display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; font-size:12px; color:var(--muted,#999); }
.rec-chip{ padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; color:#fff; background:var(--c,#444); }
.rec-acc{ display:flex; gap:8px; padding:10px 14px 14px; margin-top:auto; }
.rec-acc a{ flex:1; text-align:center; text-decoration:none; font-size:13px; font-weight:700; padding:8px 6px; border-radius:8px; border:1px solid var(--accent); color:var(--accent); transition:0.2s; }
.rec-acc a:hover{ filter:brightness(1.2); }
.rec-acc a.v{ background:var(--accent); color:#fff; }

/* ===== CATEGORIAS ===== */
.categorias{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}
.categorias h2{
    text-align:center;
    margin-bottom:40px;
    font-size:35px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}
.card{
    background:var(--card,#1c1c1c);
    border-radius:15px;
    overflow:hidden;
    transition:0.4s;
    text-align:center;
}
.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    display:block;
    background:var(--card2,#262626);
}
.card h3{ padding:15px; margin:0; }
.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 25px var(--accent);
}
.card a{
    display:block;
    color:var(--text,white);
    text-decoration:none;
}
.estado{
    grid-column:1 / -1;
    text-align:center;
    color:var(--muted,#888);
    padding:40px 10px;
}

/* ===== FOOTER ===== */
footer{
    text-align:center;
    padding:30px;
    background:var(--card,#111);
    margin-top:40px;
    font-size:14px;
    color:var(--muted,#aaa);
}

@media(max-width:600px){
    .banner h1{ font-size:38px; }
}
</style>
<script src="estilo.js"></script>
<script>MS47_ESTILO.aplicarCache("home");</script>
</head>
<body>

<div class="aviso" id="aviso"></div>

<div class="banner" id="banner">
    <h1 id="sitioNombre">mastersensei47</h1>
</div>

<div class="redes" id="redes"></div>

<section class="recientes" id="recientes">
    <h2>🆕 Actualizados recientemente</h2>
    <div class="rec-grid" id="recGrid"></div>
</section>

<section class="categorias">
    <h2>🎮 Categorías</h2>
    <div class="grid" id="grid">
        <div class="estado">Cargando categorías...</div>
    </div>
</section>

<footer id="footer"></footer>

<!-- Acceso oculto al panel admin: no se ve casi nada, pero se puede tocar/clickear -->
<div onclick="location.href='admin.html'"
     style="position:fixed;bottom:10px;right:10px;width:40px;height:40px;cursor:pointer;z-index:2000;opacity:0.05;">
</div>

<script src="config.js"></script>
<script src="defaults.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const { firebaseConfig } = window.MS47;
const D = window.MS47_DEFAULTS;
const E = window.MS47_ESTILO;
const CACHE_KEY = "ms47_home_v1";

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function urlSegura(u){
  u = String(u || "").trim();
  return (u && !/^\s*(javascript|data|vbscript):/i.test(u)) ? u : "";
}
function leerCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){ return null; } }
function guardarCache(v){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(v)); }catch(e){} }

const ESTADOS = {
  ok: ["✅ Funciona", "#2ecc71"], parcial: ["⚠️ Parcial", "#f5a623"], actualizando: ["🛠 Actualizando", "#3b9eff"],
  desactualizado: ["⏳ Desactualizado", "#ff8a3d"], ultima: ["🆕 Última versión", "#00e5c7"],
  proximamente: ["🔜 Próximamente actualizado", "#b07cff"], caido: ["❌ Links caídos", "#ff4d5e"]
};
function esImagen(u){ return !!u && !/youtu|\.(mp4|webm|ogg|ogv|mov|m3u8)(\?|$)/i.test(u); }
// Link al video propio: el que cargaste en el admin; si no hay, el de verificación si es de YouTube
function linkVideo(d){
  const yt = (u) => {
    u = urlSegura(u);
    const m = u.match(/youtu\.be\/([\w-]{6,})|youtube\.com\/(?:embed\/|shorts\/)([\w-]{6,})|[?&]v=([\w-]{6,})/i);
    return m ? "https://www.youtube.com/watch?v=" + (m[1] || m[2] || m[3]) : "";
  };
  const propio = urlSegura(d.videoPropio);
  if(propio) return yt(propio) || (/^https?:\/\//i.test(propio) ? propio : "");
  return yt(d.verificacion);
}
function haceCuanto(ts){
  const dias = Math.floor((Date.now() - ts) / 864e5);
  if(dias <= 0) return "Hoy";
  if(dias === 1) return "Ayer";
  if(dias < 30) return "Hace " + dias + " días";
  return new Date(ts).toLocaleDateString("es-AR");
}
function renderRecientes(cfg, recientes){
  const sec = document.getElementById("recientes"), grid = document.getElementById("recGrid");
  const n = Math.min(24, Math.max(1, parseInt(cfg.recientesN, 10) || 8));
  const lista = Object.entries(recientes || {})
    .filter(([, d]) => d && d.actualizado)
    .sort((a, b) => b[1].actualizado - a[1].actualizado)
    .slice(0, n);
  if(cfg.recientesOn === false || !lista.length){ sec.style.display = "none"; return; }
  grid.innerHTML = lista.map(([slug, d]) => {
    const img = [d.portada, d.fondo, d.imagenIzq, d.imagenCentro, d.imagenDer, (d.galeria || [])[0]].find(esImagen) || "";
    const titulo = d.titulo || slug;
    const est = d.estado === "custom" ? (d.estadoTxt ? `<span class="rec-chip">${esc(d.estadoTxt)}</span>` : "")
      : (ESTADOS[d.estado] ? `<span class="rec-chip" style="--c:${ESTADOS[d.estado][1]}">${ESTADOS[d.estado][0]}</span>` : "");
    const v = linkVideo(d);
    return `
      <div class="rec-card">
        <a class="rec-main" href="juego.html?slug=${encodeURIComponent(slug)}">
          ${img ? window.MS47_ESTILO.img(urlSegura(img), 420, titulo) : `<img alt="" style="visibility:hidden">`}
          <div class="rec-info">
            <h3>${esc(titulo)}</h3>
            <div class="rec-meta">${est}${d.version ? `<span>${esc(d.version)}</span>` : ""}<span>${esc(haceCuanto(d.actualizado))}</span></div>
          </div>
        </a>
        <div class="rec-acc">
          <a href="juego.html?slug=${encodeURIComponent(slug)}">Ver página</a>
          ${v ? `<a class="v" href="${esc(v)}" target="_blank" rel="noopener">▶ Mi video</a>` : ""}
        </div>
      </div>`;
  }).join("");
  grid.querySelectorAll("img").forEach(i => i.addEventListener("error", () => { i.style.visibility = "hidden"; }));
  sec.style.display = "block";
}

function render({ config, categorias, recientes }){
  const cfg = D.mezclarConfig(config);
  renderRecientes(cfg, recientes);

  // Si la base está totalmente vacía (todavía no se cargó nada desde el admin) se usan los valores iniciales
  const usarDefaults = !categorias && !(config && config.inicializado);
  const cats = usarDefaults ? D.DEFAULT_CATEGORIAS : (categorias || {});

  // Estética (general + la de esta página, definidas en el admin → pestaña Estética)
  const temaAplicado = E.aplicarDesdeTemas(cfg.temas, "home", null);

  // Color de acento de "Ajustes del sitio" (si la estética define uno, manda la estética)
  if(temaAplicado.acento){
    document.documentElement.style.removeProperty("--accent");
  }else if(/^#[0-9a-f]{3,8}$/i.test(cfg.colorAcento || "")){
    document.documentElement.style.setProperty("--accent", cfg.colorAcento);
  }

  // Aviso
  const aviso = document.getElementById("aviso");
  if(cfg.aviso){ aviso.textContent = cfg.aviso; aviso.style.display = "block"; }
  else { aviso.style.display = "none"; }

  // Banner
  const banner = document.getElementById("banner");
  const img = urlSegura(cfg.bannerImagen);
  banner.style.backgroundImage = img ? `url("${img.replace(/"/g, "%22")}")` : "none";
  document.getElementById("sitioNombre").textContent = cfg.sitioNombre || "";

  // Redes
  const redes = (Array.isArray(cfg.redes) ? cfg.redes : []).filter(r => r && urlSegura(r.url));
  document.getElementById("redes").innerHTML = redes.map(r => {
    const s = D.SOCIALES[r.tipo] || D.SOCIALES.web;
    return `<a href="${esc(urlSegura(r.url))}" target="_blank" rel="noopener" aria-label="${esc(s.nombre)}"><i class="${s.icono}"></i></a>`;
  }).join("");

  // Footer
  document.getElementById("footer").textContent = cfg.footer || "";

  // Categorías
  const lista = Object.keys(cats)
    .map(slug => ({ slug, ...cats[slug] }))
    .filter(c => c.visible !== false)
    .sort((a, b) => (a.orden ?? 9999) - (b.orden ?? 9999) || String(a.nombre).localeCompare(String(b.nombre)));

  const grid = document.getElementById("grid");
  if(!lista.length){
    grid.innerHTML = `<div class="estado">Todavía no hay categorías.</div>`;
    return;
  }
  grid.innerHTML = lista.map(c => {
    const enlace = urlSegura(c.enlace);
    const href = enlace || `categoria.html?slug=${encodeURIComponent(c.slug)}`;
    const imagen = urlSegura(c.imagen);
    return `
      <div class="card">
        <a href="${esc(href)}">
          ${imagen ? window.MS47_ESTILO.img(imagen, 480, c.nombre) : `<img alt="" style="visibility:hidden">`}
          <h3>${esc(c.nombre)}</h3>
        </a>
      </div>`;
  }).join("");

  grid.querySelectorAll("img").forEach(i => i.addEventListener("error", () => { i.style.visibility = "hidden"; }));
}

async function iniciar(){
  const cache = leerCache();
  if(cache) render(cache);

  try{
    const db = getDatabase(initializeApp(firebaseConfig));
    const [c, k, r] = await Promise.all([
      get(ref(db, "config")), get(ref(db, "categorias")),
      // Los últimos juegos guardados/editados (si falla, la home sigue andando sin esta sección)
      get(query(ref(db, "paginasJuegos"), orderByChild("actualizado"), limitToLast(24))).catch(() => null)
    ]);
    const datos = { config: c.val(), categorias: k.val(), recientes: r ? r.val() : null };
    render(datos);
    guardarCache(datos);
  }catch(err){
    console.error(err);
    if(!cache) render({ config: null, categorias: null });
  }
}
iniciar();
</script>

<script src="ms47-widgets.js"></script>
</body>
</html>
