<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categoría | MS47</title>
<style>
body{margin:0;background:var(--bg,#0f0f0f);color:var(--text,white);font-family:var(--font-body,Arial,sans-serif)}
header{position:fixed;top:0;width:100%;background:var(--card,#111);padding:15px;text-align:center;font-size:22px;font-weight:bold;box-shadow:0 2px 10px rgba(0,0,0,.6);z-index:1000;box-sizing:border-box}
.volver{position:absolute;left:15px;top:17px;font-size:14px;text-decoration:none;color:var(--accent,#00bfff)}
.container{padding:100px 20px 40px;max-width:1200px;margin:auto}
.buscador{display:block;width:100%;max-width:420px;margin:0 auto 10px;padding:11px 14px;border-radius:8px;border:1px solid var(--line,#2a2a2a);background:var(--card,#1b1b1b);color:var(--text,#fff);font-size:15px;box-sizing:border-box}
.buscador:focus{outline:none;border-color:var(--accent,#00bfff)}
.conteo{text-align:center;color:var(--muted,#888);font-size:13px;margin-bottom:20px;min-height:16px}
h2.seccion{font-size:18px;margin:30px 0 14px;border-left:4px solid var(--accent,#00bfff);padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:var(--card,#1b1b1b);border-radius:8px;overflow:hidden;cursor:pointer;transition:.3s;position:relative;text-decoration:none;color:var(--text,white);display:block}
.card:hover{transform:scale(1.05);box-shadow:0 0 15px var(--accent,#00bfff)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--card2,#262626)}
.card h3{padding:10px;font-size:14px;margin:0}
.badge{position:absolute;top:8px;left:8px;color:#fff;background:rgba(0,0,0,.75);border-radius:6px;padding:3px 7px;font-size:12px}
.loader{text-align:center;padding:20px;color:var(--muted,#888)}
.loader.error{color:#ff8a93}
.oculto{display:none !important}
.barra{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;align-items:center;margin:0 auto 22px;max-width:900px}
.barra select{padding:9px 12px;border-radius:8px;border:1px solid var(--line,#2a2a2a);background:var(--card,#1b1b1b);color:var(--text,#fff);font-size:14px;cursor:pointer}
.barra select:focus{outline:none;border-color:var(--accent,#00bfff)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line,#2a2a2a);background:var(--card,#1b1b1b);color:var(--text,#fff);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--accent,#00bfff)}
.chip.on{background:var(--accent,#00bfff);border-color:var(--accent,#00bfff);color:#fff;font-weight:700}
.est{position:absolute;top:8px;right:8px;color:#fff;background:var(--c,#444);border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700;max-width:70%;text-align:right}
</style>
<script src="estilo.js"></script>
<script>MS47_ESTILO.aplicarCache("cat__" + (new URLSearchParams(location.search).get("slug") || "").trim());</script>
</head>
<body>

<header>
<a href="index.html" class="volver">⬅ Volver</a>
<span id="titulo">Cargando...</span>
</header>

<div class="container">
    <input type="text" id="buscar" class="buscador" placeholder="🔍 Buscar en esta categoría..." style="display:none">
    <div class="conteo" id="conteo"></div>
    <div class="barra" id="barra" style="display:none">
        <select id="orden" aria-label="Ordenar">
            <option value="def">Orden: como está armada</option>
            <option value="rec">Más recientes primero</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
        </select>
        <div class="chips" id="chips"></div>
    </div>
    <div id="contenido"></div>
    <div id="loader" class="loader">Cargando...</div>
</div>

<script src="config.js"></script>
<script src="defaults.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const { firebaseConfig, YT_API_KEY } = window.MS47;
const D = window.MS47_DEFAULTS;
const E = window.MS47_ESTILO;

const loader = document.getElementById("loader");
const contenido = document.getElementById("contenido");

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function urlSegura(u){
  u = String(u || "").trim();
  return (u && !/^\s*(javascript|data|vbscript):/i.test(u)) ? u : "";
}
function esImagen(u){ return !!u && !/youtu|\.(mp4|webm|ogg|ogv|mov|m3u8)(\?|$)/i.test(u); }
function leer(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function guardar(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function estado(msg, error){
  loader.style.display = "block";
  loader.className = "loader" + (error ? " error" : "");
  loader.textContent = msg;
}

// Acepta el ID suelto o un link de YouTube con ?list=
function idPlaylist(v){
  v = String(v || "").trim();
  const m = v.match(/[?&]list=([^&#]+)/);
  return m ? m[1] : v;
}

// Descarga una playlist completa (con caché de 1 hora para no gastar la cuota de YouTube)
async function cargarPlaylist(id){
  const key = "ms47_pl_" + id;
  const c = leer(key);
  if(c && Date.now() - c.t < 3600 * 1000) return c.items;

  try{
    const items = [];
    let token = "";
    do{
      let url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${encodeURIComponent(id)}&key=${YT_API_KEY}`;
      if(token) url += `&pageToken=${token}`;
      const res = await fetch(url);
      const data = await res.json();
      if(data.error) throw new Error(data.error.message);
      for(const it of (data.items || [])){
        const sn = it.snippet;
        const vid = sn && sn.resourceId && sn.resourceId.videoId;
        if(!vid) continue;
        if(/^(Private|Deleted) video$/i.test(sn.title)) continue;
        const th = sn.thumbnails || {};
        const thumb = (th.high || th.medium || th.default || {}).url || "";
        items.push({ id: vid, title: sn.title, thumb });
      }
      token = data.nextPageToken || "";
    }while(token);
    guardar(key, { t: Date.now(), items });
    return items;
  }catch(err){
    if(c) return c.items;   // si falla, se usa lo último guardado
    throw err;
  }
}

const ESTADOS = {
  ok: ["✅ Funciona", "#2ecc71"], parcial: ["⚠️ Parcial", "#f5a623"], actualizando: ["🛠 Actualizando", "#3b9eff"],
  desactualizado: ["⏳ Desactualizado", "#ff8a3d"], ultima: ["🆕 Última versión", "#00e5c7"],
  proximamente: ["🔜 Próximamente actualizado", "#b07cff"], caido: ["❌ Links caídos", "#ff4d5e"]
};
// Etiqueta de estado de un juego: { k: clave para filtrar, txt: texto, c: color } o null
function infoEstado(d){
  if(!d) return null;
  if(d.estado === "custom"){ const x = String(d.estadoTxt || "").trim(); return x ? { k: "custom:" + x.toLowerCase(), txt: x, c: "#444" } : null; }
  return ESTADOS[d.estado] ? { k: d.estado, txt: ESTADOS[d.estado][0], c: ESTADOS[d.estado][1] } : null;
}

function miniaturaJuego(d){
  return [d.portada, d.fondo, d.imagenIzq, d.imagenCentro, d.imagenDer, (d.galeria || [])[0], d.poster]
    .find(esImagen) || "";
}

function tarjeta({ href, titulo, img, badge, nueva, est, u }){
  return `
    <a class="card" href="${esc(href)}" ${nueva ? 'target="_blank" rel="noopener"' : ""} data-t="${esc(String(titulo).toLowerCase())}" data-e="${esc(est ? est.k : "")}" data-u="${+u || 0}">
      ${badge ? `<span class="badge">${badge}</span>` : ""}
      ${est ? `<span class="est" style="--c:${est.c}">${esc(est.txt)}</span>` : ""}
      ${img ? window.MS47_ESTILO.img(img, 420, "") : `<img alt="" style="visibility:hidden">`}
      <h3>${esc(titulo)}</h3>
    </a>`;
}

async function iniciar(){
  const slug = (new URLSearchParams(location.search).get("slug") || "").trim();
  if(!slug){ estado("Falta el parámetro ?slug= en el link.", true); return; }

  let db;
  try{ db = getDatabase(initializeApp(firebaseConfig)); }
  catch(e){ estado("No se pudo conectar con la base de datos.", true); return; }

  // Estética (general + tipo "categorías" + la de esta categoría), definida en el admin
  get(ref(db, "config/temas")).then(s => E.aplicarDesdeTemas(s.val(), "cat__" + slug, "categoria")).catch(() => {});

  // 1) Categoría
  let cat = null;
  let usarDefault = false;
  try{
    cat = (await get(ref(db, "categorias/" + slug))).val();
    if(!cat){
      const ini = (await get(ref(db, "config/inicializado"))).val();
      usarDefault = !ini;
    }
  }catch(err){
    console.error(err);
    usarDefault = true;
  }
  if(!cat && usarDefault && D.DEFAULT_CATEGORIAS[slug]) cat = D.DEFAULT_CATEGORIAS[slug];

  if(!cat){ document.getElementById("titulo").textContent = "No encontrada"; estado("Esta categoría no existe o fue eliminada.", true); return; }
  if(cat.visible === false){ /* oculta de la home, pero el link directo sigue andando */ }

  const titulo = `${cat.icono ? cat.icono + " " : ""}${cat.nombre || slug}`;
  document.getElementById("titulo").textContent = titulo;
  document.title = `${cat.nombre || slug} | MS47`;

  // 2) Juegos y series elegidos desde el admin
  const itemsDef = Array.isArray(cat.items) ? cat.items : [];
  const itemsCargados = (await Promise.all(itemsDef.map(async it => {
    try{
      const nodo = it.tipo === "serie" ? "paginasSeries/" : "paginasJuegos/";
      const s = await get(ref(db, nodo + it.slug));
      return s.exists() ? { tipo: it.tipo, slug: it.slug, d: s.val() } : null;
    }catch(e){ return null; }
  }))).filter(Boolean);

  // 3) Playlists de YouTube
  const playlists = (Array.isArray(cat.playlists) ? cat.playlists : []).map(idPlaylist).filter(Boolean);
  estado(playlists.length ? "Cargando videos..." : "");
  const resultados = await Promise.allSettled(playlists.map(cargarPlaylist));
  const videos = [];
  const vistos = new Set();
  let errores = 0, ultimoError = "";
  resultados.forEach(r => {
    if(r.status === "fulfilled"){
      r.value.forEach(v => { if(!vistos.has(v.id)){ vistos.add(v.id); videos.push(v); } });
    }else{ errores++; ultimoError = r.reason && r.reason.message || ""; }
  });

  // 4) Armar la página
  const hayAmbos = itemsCargados.length && videos.length;
  let html = "";

  if(itemsCargados.length){
    if(hayAmbos) html += `<h2 class="seccion">🎮 Juegos y series</h2>`;
    html += `<div class="grid">` + itemsCargados.map(it => {
      const esSerie = it.tipo === "serie";
      return tarjeta({
        href: `${esSerie ? "serie" : "juego"}.html?slug=${encodeURIComponent(it.slug)}`,
        titulo: it.d.titulo || it.slug,
        img: miniaturaJuego(it.d),
        badge: esSerie ? ((it.d.tipo || it.d.tipoContenido) === "pelicula" ? "🎬" : "📺") : "🎮",
        est: esSerie ? null : infoEstado(it.d),
        u: it.d.actualizado
      });
    }).join("") + `</div>`;
  }

  if(videos.length){
    if(hayAmbos) html += `<h2 class="seccion">▶️ Videos</h2>`;
    html += `<div class="grid">` + videos.map(v => tarjeta({
      href: `https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}`,
      titulo: v.title, img: v.thumb, nueva: true
    })).join("") + `</div>`;
  }

  contenido.innerHTML = html;
  contenido.querySelectorAll("img").forEach(i => i.addEventListener("error", () => { i.style.visibility = "hidden"; }));

  const total = itemsCargados.length + videos.length;
  if(!total){
    estado(errores ? "No se pudieron cargar los videos: " + ultimoError : "Esta categoría todavía no tiene contenido.", !!errores);
  }else if(errores){
    estado("Algunas playlists no se pudieron cargar: " + ultimoError, true);
  }else{
    loader.style.display = "none";
  }

  if(total){
    const buscar = document.getElementById("buscar");
    const conteo = document.getElementById("conteo");
    const barra = document.getElementById("barra");
    const orden = document.getElementById("orden");
    const chips = document.getElementById("chips");
    const cards = [...contenido.querySelectorAll(".card")];
    cards.forEach((c, i) => { c.dataset.i = i; });
    const txtTotal = `${total} ${total === 1 ? "elemento" : "elementos"}`;
    buscar.style.display = "block";
    conteo.textContent = txtTotal;

    // Chips de estado: solo los que realmente tiene algún juego de esta categoría
    const estados = new Map();
    itemsCargados.forEach(it => { if(it.tipo !== "serie"){ const e = infoEstado(it.d); if(e && !estados.has(e.k)) estados.set(e.k, e); } });
    let filtroEstado = "";
    if(estados.size){
      chips.innerHTML = `<button type="button" class="chip on" data-k="">Todos</button>` +
        [...estados.values()].map(e => `<button type="button" class="chip" data-k="${esc(e.k)}">${esc(e.txt)}</button>`).join("");
      chips.addEventListener("click", (ev) => {
        const b = ev.target.closest(".chip"); if(!b) return;
        filtroEstado = b.dataset.k;
        chips.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
        aplicar();
      });
    }
    if(total > 1 || estados.size) barra.style.display = "flex";
    if(total <= 1) orden.style.display = "none";

    function ordenar(){
      const modo = orden.value;
      contenido.querySelectorAll(".grid").forEach(g => {
        const hijos = [...g.children];
        hijos.sort((a, b) => {
          if(modo === "rec") return (+b.dataset.u || 0) - (+a.dataset.u || 0) || a.dataset.i - b.dataset.i;
          if(modo === "az") return a.dataset.t.localeCompare(b.dataset.t, "es");
          if(modo === "za") return b.dataset.t.localeCompare(a.dataset.t, "es");
          return a.dataset.i - b.dataset.i;
        });
        hijos.forEach(h => g.appendChild(h));
      });
    }
    function aplicar(){
      const q = buscar.value.trim().toLowerCase();
      ordenar();
      let visibles = 0;
      cards.forEach(c => {
        const ok = (!q || c.dataset.t.includes(q)) && (!filtroEstado || c.dataset.e === filtroEstado);
        c.classList.toggle("oculto", !ok);
        if(ok) visibles++;
      });
      // Si una sección quedó sin tarjetas visibles, se esconde también su título
      contenido.querySelectorAll(".grid").forEach(g => {
        const hay = !!g.querySelector(".card:not(.oculto)");
        g.classList.toggle("oculto", !hay);
        const h = g.previousElementSibling;
        if(h && h.classList.contains("seccion")) h.classList.toggle("oculto", !hay);
      });
      conteo.textContent = (q || filtroEstado) ? `${visibles} de ${total}` : txtTotal;
    }
    buscar.addEventListener("input", aplicar);
    orden.addEventListener("change", aplicar);
  }
}
iniciar();
</script>
<script src="ms47-widgets.js"></script>
</body>
</html>
