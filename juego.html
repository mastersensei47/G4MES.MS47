<style>
:root{
  --bg:#0a0a0b;
  --card:#151517;
  --card2:#1b1b1e;
  --line:#262629;
  --accent:#ff2b3d;
  --accent2:#00e5c7;
  --text:#f2f2f2;
  --muted:#9a9aa0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body,'Inter',Arial,sans-serif);}
h1,h2{font-family:var(--font-title,'Poppins',Arial,sans-serif);}

/* ---------- NAV ---------- */
.navbar{width:100%;background:color-mix(in srgb,var(--bg) 75%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:fixed;top:0;left:0;z-index:1000;border-bottom:1px solid var(--line);}
.nav-container{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;}
.logo{font-family:var(--font-title,'Poppins',sans-serif);font-size:22px;font-weight:800;color:var(--text);letter-spacing:1px;text-shadow:0 0 14px rgba(255,43,61,0.6);text-decoration:none;}
.nav-links{display:flex;gap:10px;align-items:center;}
.nav-links a{color:var(--text);text-decoration:none;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:20px;transition:0.25s;border:1px solid transparent;}
.nav-links a:hover{border-color:var(--accent);color:var(--text);}
.btn-mas-juegos{background:var(--card2);border:1px solid var(--line) !important;}

/* ---------- LAYOUT ---------- */
main{margin-top:90px;padding:0 20px 60px;max-width:1300px;margin-left:auto;margin-right:auto;}
main.fade-in{animation:fadeIn 0.5s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ---------- HERO ---------- */
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;background:linear-gradient(160deg,var(--card2),var(--bg));background-size:cover;background-position:center;min-height:340px;padding:44px 36px;border-radius:18px;margin-bottom:34px;border:1px solid var(--line);overflow:hidden;}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.75) 100%);pointer-events:none;}
.hero.con-fondo{color:#fff;}
.hero.con-fondo::before{background:linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(6,6,7,0.92) 100%);}
.hero > *{position:relative;z-index:2;}
.hero > .hero-fondo{position:absolute;inset:0;z-index:0;overflow:hidden;}
.hero-fondo-img{position:absolute;inset:0;background-size:cover;background-position:center;}
.hero-fondo-video{position:absolute;inset:0;opacity:0;transition:opacity 0.6s ease;}
.hero-fondo-video.siempre{opacity:1;}
.hero-fondo-video iframe,.hero-fondo-video video{width:100%;height:100%;object-fit:cover;border:none;}
.hero.fondo-modo-hover:hover .hero-fondo-video{opacity:1;}
.hero.fondo-modo-rotativo.fondo-mostrando-video .hero-fondo-video{opacity:1;}
.video{flex:1;min-width:280px;}
.video iframe,.video video,.video .media-slot,.video img{width:100%;height:250px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,0.55);border:1px solid var(--line);background:#000;object-fit:cover;}
.titulo{flex:1.2;text-align:center;min-width:260px;}
.titulo h1{font-size:32px;font-weight:800;margin-top:12px;margin-bottom:4px;text-shadow:0 2px 12px rgba(0,0,0,0.8);letter-spacing:0.3px;}
.titulo .barra{width:60px;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;margin:14px auto 0;}
.video-centro{margin-bottom:16px;display:flex;justify-content:center;}
.video-centro iframe,.video-centro video,.video-centro .media-slot,.video-centro img{width:100%;max-width:400px;height:220px;border-radius:16px;box-shadow:0 0 30px rgba(255,43,61,0.35);border:1px solid var(--line);background:#000;object-fit:cover;}

/* ---------- MEDIA SLOT (imagen + video: hover / rotativo) ---------- */
.media-slot{position:relative;overflow:hidden;}
.media-slot .capa-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;transition:opacity 0.5s ease;}
.media-slot .capa-video{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity 0.5s ease;pointer-events:none;}
.media-slot .capa-video iframe,.media-slot .capa-video video{width:100%;height:100%;object-fit:cover;border:none;background:#000;}
.media-slot.modo-hover:hover .capa-video{opacity:1;}
.media-slot.modo-rotativo.mostrando-video .capa-video{opacity:1;}
.media-slot .capa-video-simple{position:relative;z-index:1;width:100%;height:100%;}
.media-slot .capa-video-simple iframe,.media-slot .capa-video-simple video{width:100%;height:100%;border:none;background:#000;}

/* ---------- DESCARGAS ---------- */
.bloque-titulo{display:flex;align-items:center;gap:10px;margin:8px 0 16px;}
.bloque-titulo h2{font-size:17px;color:var(--text);font-weight:700;}
.bloque-titulo .linea{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}

.partes-grid{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 34px 0;}
.partes-grid a{position:relative;background:var(--card2);padding:13px 22px;border-radius:10px;text-decoration:none;color:var(--text);font-weight:600;font-size:14px;border:1px solid var(--line);transition:0.25s;display:flex;align-items:center;gap:8px;}
.partes-grid a::before{content:"⬇";font-size:13px;opacity:0.8;}
.partes-grid a:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,43,61,0.35);}

/* ---------- ESTADO DE LA DESCARGA + LINK ROTO ---------- */
.chips-est{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;}
.chip-est{--c:#9a9aa0;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:700;color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 15%,rgba(0,0,0,0.35));}
.dl-nota{margin:-6px 0 16px;font-size:13px;color:var(--muted);line-height:1.55;}
.dl-item{display:flex;align-items:stretch;}
.dl-item a{border-radius:10px 0 0 10px;}
.dl-rep{margin:0;padding:0 12px;background:var(--card2);color:var(--muted);border:1px solid var(--line);border-left:0;border-radius:0 10px 10px 0;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:0.2s;}
.dl-rep:hover:not(:disabled){color:#ff9aa2;border-color:rgba(255,43,61,0.5);}
.dl-rep:disabled{opacity:0.7;cursor:default;}

/* ---------- ACORDEON ---------- */
.acordeon{background:var(--card);border-radius:12px;margin-bottom:14px;border:1px solid var(--line);overflow:hidden;}
.acordeon-header{padding:16px 18px;cursor:pointer;font-weight:700;font-size:15px;background:var(--card2);display:flex;justify-content:space-between;align-items:center;transition:0.2s;user-select:none;}
.acordeon-header:hover{filter:brightness(1.2);}
.acordeon-header span{transition:transform 0.3s;color:var(--muted);}
.acordeon-header.active span{transform:rotate(180deg);color:var(--accent2);}
.acordeon-content{max-height:0;overflow:hidden;transition:max-height 0.4s ease;}
.acordeon-content ul{list-style:none;padding:16px;}
.acordeon-content ul li{background:var(--card2);margin-bottom:7px;padding:10px 12px;border-radius:8px;font-size:14px;border-left:3px solid var(--accent2);}
.acordeon-content iframe{display:block;}
.verif-media{width:100%;height:450px;border:none;background:#000;display:block;}

/* ---------- DETALLES ---------- */
.seccion-detalles{background:var(--card);padding:26px;border-radius:16px;margin-top:26px;border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:30px;}
.seccion-detalles .col{min-width:0;}
.seccion-detalles h2{font-size:16px;font-weight:700;border-left:3px solid var(--accent2);padding-left:10px;margin-bottom:12px;}
.info-lista{list-style:none;padding:0;}
.info-lista li{padding:10px 12px;margin-bottom:8px;background:var(--card2);border-radius:8px;font-size:14px;color:var(--text);}
@media(max-width:800px){.seccion-detalles{grid-template-columns:1fr;}}

.ap-cuerpo{padding:16px;}
.ap-texto p{font-size:14px;line-height:1.65;color:var(--text);margin-bottom:10px;}
.ap-texto p:last-child{margin-bottom:0;}
.ap-links{margin:0 !important;}
.ap-video{width:100%;height:420px;border:none;background:#000;display:block;border-radius:10px;}
.ap-cuerpo .galeria-capturas{margin-top:0;}
.apartado-visible{margin-bottom:30px;}
.apartado-visible .ap-cuerpo{padding:0;}
.apartado-visible .info-lista{padding:0;}

/* ---------- GALERIA ---------- */
.titulo-galeria{margin-top:36px;}
.galeria-capturas{display:grid;grid-template-columns:repeat(auto-fit, minmax(240px,1fr));gap:16px;margin-top:16px;}
.galeria-capturas img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;transition:0.25s;}
.galeria-capturas img:hover{transform:scale(1.03);border-color:var(--accent);box-shadow:0 10px 25px rgba(0,0,0,0.5);}

/* ---------- LIGHTBOX ---------- */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;z-index:5000;cursor:zoom-out;padding:30px;}
#lightbox.abierto{display:flex;}
#lightbox img{max-width:90%;max-height:90%;border-radius:10px;box-shadow:0 0 40px rgba(0,0,0,0.7);}

/* ---------- ESTADOS ---------- */
.estado-box{text-align:center;margin-top:140px;color:var(--muted);font-size:16px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:girar 0.8s linear infinite;}
@keyframes girar{to{transform:rotate(360deg);}}
.estado-icono{font-size:34px;}

@media(max-width:1000px){.hero{flex-direction:column;padding:26px;text-align:center;}}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = window.MS47.firebaseConfig;
const E = window.MS47_ESTILO;

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function toEmbedUrl(url){
  if(!url) return "";
  url = url.trim();
  const watchMatch = url.match(/[?&]v=([^&]+)/);
  const shortMatch = url.match(/youtu\.be\/([^?&]+)/);
  const embedMatch = url.match(/embed\/([^?&]+)/);
  let id = "";
  if(watchMatch) id = watchMatch[1];
  else if(shortMatch) id = shortMatch[1];
  else if(embedMatch) id = embedMatch[1];
  else id = url;
  return `https://www.youtube.com/embed/${id}`;
}

function detectarTipoVideo(url){
  if(!url) return null;
  url = url.trim();
  if(/youtu\.be|youtube\.com/i.test(url)) return "youtube";
  if(/drive\.google\.com/i.test(url)) return "drive";
  if(/\.(mp4|webm|ogg|ogv|mov|m3u8)(\?.*)?$/i.test(url)) return "archivo";
  return "youtube";
}

function extraerDriveId(url){
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : url;
}

// Arma el <video> o <iframe> segun sea un link de YouTube, Drive, o un archivo directo (.mp4/.webm/etc)
function renderVideo(url, claseExtra=""){
  const tipo = detectarTipoVideo(url);
  if(!tipo) return "";
  if(tipo === "archivo"){
    return `<video class="${claseExtra}" src="${url}" controls playsinline></video>`;
  }
  if(tipo === "drive"){
    return `<iframe class="${claseExtra}" src="https://drive.google.com/file/d/${extraerDriveId(url)}/preview" allowfullscreen></iframe>`;
  }
  return `<iframe class="${claseExtra}" src="${toEmbedUrl(url)}" allowfullscreen></iframe>`;
}

// Igual que renderVideo pero sin controles, pensado para fondos/hover (autoplay, mute, loop)
function renderVideoTag(url, autoplayLoop){
  const tipo = detectarTipoVideo(url);
  if(tipo === "archivo"){
    return `<video muted loop playsinline ${autoplayLoop ? "autoplay" : ""} src="${url}"></video>`;
  }
  if(tipo === "drive"){
    return `<iframe src="https://drive.google.com/file/d/${extraerDriveId(url)}/preview" allow="autoplay"></iframe>`;
  }
  const embed = toEmbedUrl(url);
  const id = embed.split("/embed/")[1];
  return `<iframe src="https://www.youtube.com/embed/${id}?autoplay=${autoplayLoop?1:0}&mute=1&controls=0&loop=1&playlist=${id}&rel=0" allow="autoplay"></iframe>`;
}

// Arma el contenido de un video del hero (izq/centro/der), con soporte de imagen + modo hover/rotativo
function renderMediaSlot(video, imagen, modo){
  if(!video && !imagen) return "";
  if(!video){
    return `<img src="${imagen}">`;
  }
  if(!imagen || modo === "video"){
    // Video suelto: se comporta como un embed normal, no se reproduce solo
    return renderVideo(video);
  }
  const modoClase = modo === "rotativo" ? "modo-rotativo" : "modo-hover";
  return `
    <div class="media-slot ${modoClase}">
      <img class="capa-img" src="${imagen}">
      <div class="capa-video">${renderVideoTag(video, true)}</div>
    </div>`;
}

// Arma el fondo grande del hero, con soporte de imagen + video + modo hover/rotativo
function armarFondoHero(fondoImg, fondoVideo, fondoModo){
  if(!fondoImg && !fondoVideo) return { html: "", clase: "" };

  let capasHtml = "";
  let clase = "con-fondo";

  if(fondoImg){
    capasHtml += `<div class="hero-fondo-img" style="background-image:url('${fondoImg}')"></div>`;
  }
  if(fondoVideo){
    const siempre = !fondoImg ? " siempre" : "";
    capasHtml += `<div class="hero-fondo-video${siempre}">${renderVideoTag(fondoVideo, true)}</div>`;
    if(fondoImg){
      clase += fondoModo === "rotativo" ? " fondo-modo-rotativo" : " fondo-modo-hover";
    }
  }

  return { html: `<div class="hero-fondo">${capasHtml}</div>`, clase };
}

// Activa el cambio automatico de los slots en modo "rotativo" (video izq/centro/der y fondo)
function inicializarRotativos(){
  document.querySelectorAll(".media-slot.modo-rotativo").forEach(el => {
    setInterval(() => el.classList.toggle("mostrando-video"), 6000);
  });
  const heroSection = document.getElementById("heroSection");
  if(heroSection && heroSection.classList.contains("fondo-modo-rotativo")){
    setInterval(() => heroSection.classList.toggle("fondo-mostrando-video"), 6000);
  }
}

function esc(str){
  const div = document.createElement("div");
  div.innerText = str || "";
  return div.innerHTML;
}

function listaHtml(items){
  return `<ul>${(items||[]).filter(Boolean).map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
}

window.toggleAcordeon = function(el){
  const content = el.nextElementSibling;
  el.classList.toggle("active");
  content.style.maxHeight = content.style.maxHeight ? null : content.scrollHeight + "px";
};

window.abrirLightbox = function(src){
  document.getElementById("lightbox-img").src = src;
  document.getElementById("lightbox").classList.add("abierto");
};

// ---------- Apartados extra (información específica del juego) ----------
function escA(str){ return esc(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
function lineasDe(txt){ return String(txt || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean); }

function cuerpoApartado(a){
  const formato = a.formato || "texto";
  const lineas = lineasDe(a.contenido);
  if(!lineas.length) return "";

  if(formato === "lista"){
    return `<ul class="info-lista">${lineas.map(l => `<li>${esc(l)}</li>`).join("")}</ul>`;
  }
  if(formato === "links"){
    const links = lineas.map(l => {
      const i = l.indexOf("|");
      const nombre = i >= 0 ? l.slice(0, i).trim() : "";
      const url = E.urlOk(i >= 0 ? l.slice(i + 1) : l);
      return url ? `<a href="${escA(url)}" target="_blank" rel="noopener">${esc(nombre || "Abrir enlace")}</a>` : "";
    }).filter(Boolean);
    return links.length ? `<div class="partes-grid ap-links">${links.join("")}</div>` : "";
  }
  if(formato === "video"){
    const url = E.urlOk(lineas[0]).replace(/"/g, "%22");
    return url ? renderVideo(url, "ap-video") : "";
  }
  if(formato === "imagenes"){
    const imgs = lineas.map(u => E.urlOk(u)).filter(Boolean);
    return imgs.length ? `<div class="galeria-capturas">${imgs.map(u => `<img src="${escA(u)}" data-src="${escA(u)}" onclick="abrirLightbox(this.dataset.src)" loading="lazy" alt="">`).join("")}</div>` : "";
  }
  // texto: los renglones vacíos separan párrafos
  const parrafos = String(a.contenido).split(/\r?\n\s*\r?\n/).map(p => p.trim()).filter(Boolean);
  return `<div class="ap-texto">${parrafos.map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("")}</div>`;
}

function apartadoHtml(a){
  if(!a) return "";
  const cuerpo = cuerpoApartado(a);
  if(!cuerpo) return "";
  const titulo = esc((a.titulo || "").trim() || "Información");
  if(a.modo === "visible"){
    return `<section class="apartado-visible"><div class="bloque-titulo"><h2>${titulo}</h2><div class="linea"></div></div><div class="ap-cuerpo">${cuerpo}</div></section>`;
  }
  const abierto = a.modo === "abierto";
  return `
    <div class="acordeon">
      <div class="acordeon-header${abierto ? " active" : ""}" onclick="toggleAcordeon(this)">${titulo} <span>▼</span></div>
      <div class="acordeon-content"${abierto ? ' style="max-height:none"' : ""}><div class="ap-cuerpo">${cuerpo}</div></div>
    </div>`;
}

function apartadosEn(lista, ubic){
  return (Array.isArray(lista) ? lista : []).filter(a => a && (a.ubic || "despues_detalles") === ubic).map(apartadoHtml).join("");
}

// ---------- Estado de la descarga (lo elige el admin) ----------
const ESTADOS = {
  ok: ["✅ Funciona", "#2ecc71"],
  parcial: ["⚠️ Parcial", "#f5a623"],
  actualizando: ["🛠 Actualizando", "#3b9eff"],
  desactualizado: ["⏳ Desactualizado", "#ff8a3d"],
  ultima: ["🆕 Última versión", "#00e5c7"],
  proximamente: ["🔜 Próximamente actualizado", "#b07cff"],
  caido: ["❌ Links caídos", "#ff4d5e"]
};
function chipsEstado(d){
  let out = "";
  if(d.estado === "custom" && String(d.estadoTxt || "").trim()) out += `<span class="chip-est">${esc(String(d.estadoTxt).trim())}</span>`;
  else if(ESTADOS[d.estado]) out += `<span class="chip-est" style="--c:${ESTADOS[d.estado][1]}">${ESTADOS[d.estado][0]}</span>`;
  if(String(d.version || "").trim()) out += `<span class="chip-est">📦 Versión ${esc(String(d.version).trim())}</span>`;
  return out ? `<div class="chips-est">${out}</div>` : "";
}

// ---------- Reportar link roto ----------
let slugActual = "", descargasActuales = [];
function hashUrl(u){ let h = 5381; for(let i = 0; i < u.length; i++) h = ((h << 5) + h + u.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function devId(){   // mismo id anónimo que usa el chat, para no contar dos veces el mismo dispositivo
  try{
    let d = localStorage.getItem("ms47w_dev");
    if(!d){ d = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("ms47w_dev", d); }
    return d;
  }catch(e){ return "x" + Math.random().toString(36).slice(2, 12); }
}
function yaReporto(h){ try{ return !!localStorage.getItem("ms47_rep_" + slugActual + "_" + h); }catch(e){ return false; } }
function marcarReportados(){
  document.querySelectorAll(".dl-rep").forEach(b => {
    const p = descargasActuales[+b.dataset.i];
    if(p && yaReporto(hashUrl(p.url))){ b.textContent = "✅ Ya avisaste"; b.disabled = true; }
  });
}
window.reportarLink = async function(btn){
  const p = descargasActuales[+btn.dataset.i];
  if(!p || btn.disabled) return;
  const h = hashUrl(p.url);
  if(yaReporto(h)){ btn.textContent = "✅ Ya avisaste"; btn.disabled = true; return; }
  if(!confirm("¿Avisar que este link no funciona?")) return;
  btn.disabled = true;
  try{
    await update(ref(db, "reportes/" + slugActual + "/" + h), {
      label: String(p.label || "Descargar").slice(0, 100),
      url: String(p.url).slice(0, 2000),
      ts: Date.now(),
      ["d/" + devId()]: true
    });
    try{ localStorage.setItem("ms47_rep_" + slugActual + "_" + h, "1"); }catch(e){}
    btn.textContent = "✅ ¡Gracias por avisar!";
  }catch(err){
    console.error(err);
    btn.disabled = false;
    alert("No se pudo enviar el aviso. Probá de nuevo en un rato.");
  }
};

async function cargarPagina(){
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");
  const main = document.getElementById("main");

  if(!slug){
    main.innerHTML = `<div class="estado-box"><div class="estado-icono">🔗</div><p>No se especificó ninguna página (falta ?slug= en el link).</p></div>`;
    return;
  }

  // Estética (general + tipo "juegos" + la de este juego), definida en el admin
  get(ref(db, "config/temas")).then(s => E.aplicarDesdeTemas(s.val(), "juego__" + slug, "juego")).catch(() => {});

  try{
    const snap = await get(ref(db, "paginasJuegos/" + slug));
    if(!snap.exists()){
      main.innerHTML = `<div class="estado-box"><div class="estado-icono">🕹️</div><p>Esta página no existe o fue eliminada.</p></div>`;
      return;
    }

    const d = snap.val();
    document.title = `${d.titulo || "MS47"} - MS47`;

    const fondoInfo = armarFondoHero(d.fondo, d.fondoVideo, d.fondoModo);
    const heroClass = `hero ${fondoInfo.clase}`.trim();

    let heroHtml = `<section class="${heroClass}" id="heroSection">`;
    heroHtml += fondoInfo.html;
    heroHtml += (d.videoIzq || d.imagenIzq) ? `<div class="video">${renderMediaSlot(d.videoIzq, d.imagenIzq, d.modoIzq)}</div>` : "";
    heroHtml += `<div class="titulo">`;
    heroHtml += (d.videoCentro || d.imagenCentro) ? `<div class="video-centro">${renderMediaSlot(d.videoCentro, d.imagenCentro, d.modoCentro)}</div>` : "";
    heroHtml += `<h1>${esc(d.titulo)}</h1>${chipsEstado(d)}<div class="barra"></div></div>`;
    heroHtml += (d.videoDer || d.imagenDer) ? `<div class="video">${renderMediaSlot(d.videoDer, d.imagenDer, d.modoDer)}</div>` : "";
    heroHtml += `</section>`;

    const descargas = (d.descargas || []).filter(x => x && x.url);
    let descargasHtml = "";
    if(descargas.length){
      slugActual = slug; descargasActuales = descargas;
      descargasHtml = `<div class="bloque-titulo"><h2>${esc(d.pesoTitulo || "Descargas")}</h2><div class="linea"></div></div>`;
      if(String(d.estadoNota || "").trim()) descargasHtml += `<p class="dl-nota">${esc(String(d.estadoNota).trim())}</p>`;
      descargasHtml += `<section class="partes-grid">`;
      descargas.forEach((p, i) => descargasHtml += `<div class="dl-item"><a href="${escA(p.url)}" target="_blank" rel="noopener">${esc(p.label || "Descargar")}</a><button type="button" class="dl-rep" data-i="${i}" onclick="reportarLink(this)" title="Avisar que este link no funciona">🚩 Link roto</button></div>`);
      descargasHtml += `</section>`;
    }

    let verificacionHtml = "";
    if(d.verificacion){
      verificacionHtml = `
        <div class="acordeon">
          <div class="acordeon-header" onclick="toggleAcordeon(this)">${esc((d.tituloVerificacion || "").trim() || "🎞️ Verificación")} <span>▼</span></div>
          <div class="acordeon-content">${renderVideo(d.verificacion, "verif-media")}</div>
        </div>`;
    }

    let contenidoHtml = "";
    if((d.contenido||[]).filter(Boolean).length){
      contenidoHtml = `
        <div class="acordeon">
          <div class="acordeon-header" onclick="toggleAcordeon(this)">${esc((d.tituloContenido || "").trim() || "🔥 Contenido / DLCs")} <span>▼</span></div>
          <div class="acordeon-content">${listaHtml(d.contenido)}</div>
        </div>`;
    }

    let detallesHtml = "";
    const tieneReq = (d.requisitos||[]).filter(Boolean).length;
    const tieneInfo = (d.infoJuego||[]).filter(Boolean).length;
    if(tieneReq || tieneInfo){
      detallesHtml = `<div class="seccion-detalles">`;
      detallesHtml += tieneReq ? `<div class="col"><h2>${esc((d.tituloRequisitos || "").trim() || "🖥️ Requisitos del sistema")}</h2><ul class="info-lista">${(d.requisitos||[]).filter(Boolean).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>` : "";
      detallesHtml += tieneInfo ? `<div class="col"><h2>${esc((d.tituloInfoJuego || "").trim() || "🎮 Información del juego")}</h2><ul class="info-lista">${(d.infoJuego||[]).filter(Boolean).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>` : "";
      detallesHtml += `</div>`;
    }

    const galeria = (d.galeria || []).filter(Boolean);
    let galeriaHtml = "";
    if(galeria.length){
      galeriaHtml = `<div class="bloque-titulo titulo-galeria"><h2>${esc((d.tituloGaleria || "").trim() || "📸 Capturas del juego")}</h2><div class="linea"></div></div><div class="galeria-capturas">`;
      galeria.forEach(src => galeriaHtml += `<img src="${src}" onclick="abrirLightbox('${src}')" loading="lazy">`);
      galeriaHtml += `</div>`;
    }

    const ap = d.apartados;
    main.innerHTML = heroHtml
      + apartadosEn(ap, "antes_descargas")
      + descargasHtml
      + apartadosEn(ap, "despues_descargas")
      + verificacionHtml + contenidoHtml
      + detallesHtml
      + apartadosEn(ap, "despues_detalles")
      + galeriaHtml
      + apartadosEn(ap, "final");
    main.classList.add("fade-in");
    marcarReportados();
    inicializarRotativos();
  }catch(err){
    console.error(err);
    main.innerHTML = `<div class="estado-box"><div class="estado-icono">⚠️</div><p>Ocurrió un error al cargar la página.</p></div>`;
  }
}

cargarPagina();
</script>

<script src="ms47-widgets.js"></script>
</body>
